<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고2 아침 공부 인증 챌린지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center">

    <div id="app" class="max-w-md mx-auto w-full h-screen sm:h-[850px] sm:rounded-3xl flex flex-col bg-white shadow-2xl relative overflow-hidden">
        
        <!-- ================= 1. 닉네임 입력 화면 ================= -->
        <div id="login-screen" class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 text-white">
            <div class="w-full max-w-sm bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/20 text-center space-y-6">
                <div class="w-20 h-20 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-4xl shadow-inner">
                    🌅
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight mb-1">고2 아침 공부 챌린지</h1>
                    <p class="text-indigo-200 text-sm">매일 아침 일찍 시작하는 멋진 습관 만들기</p>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-semibold text-indigo-200 mb-1.5 uppercase tracking-wider">나의 닉네임</label>
                        <input type="text" id="nickname-input" required placeholder="예: 2반_김민수" 
                            class="w-full px-4 py-3.5 bg-white/20 border border-white/30 rounded-2xl text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-white text-sm font-medium">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-white text-indigo-700 font-bold rounded-2xl shadow-lg hover:bg-indigo-50 transition-all active:scale-95 text-sm">
                        시작하기 🚀
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= 2. 메인 대시보드 화면 ================= -->
        <div id="main-screen" class="hidden flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
            
            <!-- 상단 헤더 -->
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-20">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-sm">✨</span>
                    <span class="font-bold text-slate-800"><span id="display-nickname" class="text-indigo-600">닉네임</span>님</span>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold text-slate-400 hover:text-slate-600 px-3 py-1.5 bg-slate-100 rounded-xl transition-all">
                    로그아웃
                </button>
            </header>

            <!-- 스크롤 컨텐츠 영역 -->
            <main class="flex-1 pb-24 overflow-y-auto">
                
                <!-- 탭 1: 나의 챌린지 기록 -->
                <div id="tab-my" class="p-6 space-y-6">
                    <!-- 누적 기록 카드 -->
                    <div class="bg-gradient-to-br from-indigo-600 to-purple-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-500/20 flex justify-between items-center relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                        <div class="relative z-10">
                            <p class="text-xs text-indigo-100 uppercase tracking-wider font-semibold">나의 누적 아침 공부</p>
                            <h2 class="text-4xl font-extrabold mt-1 tracking-tight"><span id="streak-count">0</span>일 차</h2>
                        </div>
                        <div class="relative z-10 text-4xl bg-white/20 p-3.5 rounded-2xl backdrop-blur-md border border-white/20">
                            🔥
                        </div>
                    </div>

                    <!-- 오늘 인증 카드 -->
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-5">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">📝</span>
                            <h3 class="font-bold text-slate-800 text-base">오늘 나의 아침 결심 & 인증</h3>
                        </div>
                        
                        <form id="cert-form" onsubmit="handleCertSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1.5">오늘의 결심 한마디</label>
                                <input type="text" id="resolution-input" required placeholder="예: 7시 등교 성공! 영어 지문 3개 분석하기"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium text-slate-800">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1.5">인증 사진 촬영 또는 파일 업로드</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <!-- 실시간 카메라 웹캠/모바일카메라 모달 실행 버튼 -->
                                    <button type="button" onclick="openCameraModal()" 
                                        class="py-3 bg-indigo-50 border border-indigo-100 text-indigo-700 rounded-2xl text-xs font-bold hover:bg-indigo-100 flex items-center justify-center gap-2 transition-all">
                                        📸 카메라 촬영
                                    </button>

                                    <!-- 갤러리/파일 선택 -->
                                    <input type="file" id="file-input" accept="image/*" onchange="handleImagePreview(event)" class="hidden">
                                    <button type="button" onclick="document.getElementById('file-input').click()" 
                                        class="py-3 bg-slate-100 border border-slate-200 text-slate-700 rounded-2xl text-xs font-bold hover:bg-slate-200 flex items-center justify-center gap-2 transition-all">
                                        📁 파일 선택
                                    </button>
                                </div>

                                <!-- 미리보기 영역 -->
                                <div id="preview-container" class="mt-3 hidden relative">
                                    <img id="image-preview" src="" alt="미리보기" class="w-full h-52 object-cover rounded-2xl border border-slate-200 shadow-inner">
                                    <button type="button" onclick="clearImage()" class="absolute top-3 right-3 bg-slate-900/70 hover:bg-slate-900 text-white rounded-full p-1.5 text-xs px-3 backdrop-blur-md transition-all font-semibold">
                                        ✕ 사진 삭제
                                    </button>
                                </div>
                            </div>

                            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 transition-all active:scale-95 text-sm">
                                아침 공부 인증하기 ✨
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 탭 2: 우리 반 피드 -->
                <div id="tab-feed" class="p-6 space-y-4 hidden">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <span>🏫 우리 반 아침 피드</span>
                        </h3>
                        <button onclick="fetchFeedData()" class="text-xs bg-white border border-slate-200 text-indigo-600 px-3.5 py-2 rounded-xl font-bold shadow-sm hover:bg-slate-50 transition-all">
                            🔄 새로고침
                        </button>
                    </div>
                    
                    <div id="feed-list" class="space-y-4">
                        <!-- 피드 항목들이 동적으로 로드됩니다 -->
                    </div>
                </div>

            </main>

            <!-- 하단 네비게이션 탭 -->
            <nav class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 flex justify-around py-3.5 px-6 shadow-lg z-20">
                <button onclick="switchTab('my')" id="nav-my" class="flex flex-col items-center text-indigo-600 transition-all">
                    <span class="text-xl">🏠</span>
                    <span class="text-[11px] font-bold mt-1">나의 챌린지</span>
                </button>
                <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all">
                    <span class="text-xl">💬</span>
                    <span class="text-[11px] font-semibold mt-1">우리 반 피드</span>
                </button>
            </nav>

        </div>

        <!-- ================= 실시간 카메라 촬영 모달 ================= -->
        <div id="camera-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-50 flex flex-col items-center justify-center p-4">
            <div class="bg-white rounded-3xl overflow-hidden max-w-sm w-full shadow-2xl flex flex-col">
                <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <span class="font-bold text-sm">📷 실시간 카메라 촬영</span>
                    <button onclick="closeCameraModal()" class="text-slate-400 hover:text-white text-sm font-bold px-2 py-1">✕ 닫기</button>
                </div>
                <div class="relative bg-black w-full h-80 flex items-center justify-center">
                    <video id="camera-stream" autoplay playsinline muted class="w-full h-full object-cover"></video>
                    <canvas id="camera-canvas" class="hidden"></canvas>
                </div>
                <div class="p-5 bg-white flex gap-3">
                    <button type="button" onclick="closeCameraModal()" class="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl text-sm hover:bg-slate-200 transition-all">
                        취소
                    </button>
                    <button type="button" onclick="takeSnapshot()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-2xl text-sm shadow-md hover:bg-indigo-700 transition-all">
                        찰칵! 📸
                    </button>
                </div>
            </div>
        </div>

        <!-- 커스텀 알림 모달 -->
        <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-6">
            <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center space-y-5 animate-in fade-in zoom-in duration-200">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-xl">💡</div>
                <p id="modal-message" class="text-slate-700 font-medium text-sm leading-relaxed"></p>
                <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-2xl text-sm shadow-md hover:bg-indigo-700 transition-all">확인</button>
            </div>
        </div>

    </div>

    <script>
        // =========================================================================
        // [안내] 선생님의 Google Apps Script 웹 앱 URL을 아래에 입력해 주세요!
        // 예: const GAS_WEB_APP_URL = "https://script.google.com/macros/s/.../exec";
        // 비워두면 자동으로 로컬 스토리지 테스트 모드로 동작합니다.
        // =========================================================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzG0x2VupKp5LDcFMUuyD8V2L3JT0gXEvmBicggh7Khimpmq-P8F1mcRK6N6gCFO9IY/exec"; 

        let currentUser = null;
        let base64ImageString = "";
        let mediaStream = null;

        // 앱 초기화 확인
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('morning_study_nickname');
            if (savedUser) {
                currentUser = savedUser;
                document.getElementById('display-nickname').innerText = currentUser;
                showMainScreen();
                fetchUserData();
            }
        });

        // 로그인 처리
        function handleLogin(event) {
            event.preventDefault();
            const nickname = document.getElementById('nickname-input').value.trim();

            if (!nickname) {
                showModal('닉네임을 정확히 입력해주세요.');
                return;
            }

            currentUser = nickname;
            localStorage.setItem('morning_study_nickname', currentUser);

            document.getElementById('display-nickname').innerText = currentUser;
            showMainScreen();
            fetchUserData();
        }

        // 로그아웃 처리
        function handleLogout() {
            localStorage.removeItem('morning_study_nickname');
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('nickname-input').value = '';
        }

        // 메인 화면 전환
        function showMainScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        // 탭 전환
        function switchTab(tabName) {
            const tabMy = document.getElementById('tab-my');
            const tabFeed = document.getElementById('tab-feed');
            const navMy = document.getElementById('nav-my');
            const navFeed = document.getElementById('nav-feed');

            if (tabName === 'my') {
                tabMy.classList.remove('hidden');
                tabFeed.classList.add('hidden');
                navMy.className = "flex flex-col items-center text-indigo-600 transition-all";
                navMy.querySelector('span:last-child').className = "text-[11px] font-bold mt-1";
                navFeed.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all";
                navFeed.querySelector('span:last-child').className = "text-[11px] font-semibold mt-1";
                fetchUserData();
            } else {
                tabMy.classList.add('hidden');
                tabFeed.classList.remove('hidden');
                navMy.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all";
                navMy.querySelector('span:last-child').className = "text-[11px] font-semibold mt-1";
                navFeed.className = "flex flex-col items-center text-indigo-600 transition-all";
                navFeed.querySelector('span:last-child').className = "text-[11px] font-bold mt-1";
                fetchFeedData();
            }
        }

        // 실시간 카메라 모달 열기 (노트북 웹캠 및 스마트폰 카메라 모두 지원)
        async function openCameraModal() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-stream');
            
            // 기존 스트림이 남아있다면 완벽하게 정지 및 해제
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            modal.classList.remove('hidden');

            try {
                // 기기 충돌(Device in use) 방지를 위해 간단한 제약 조건 사용
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = mediaStream;
                await video.play().catch(() => {});
            } catch (error) {
                console.error("카메라 접근 오류:", error);
                modal.classList.add('hidden');
                
                // 에러 종류에 따른 친절한 메시지 분기
                let errorMsg = '카메라 권한을 허용해주시거나, 다른 앱에서 카메라를 사용 중인지 확인해주세요.';
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMsg = '카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라 권한을 허용해주세요.';
                } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                    errorMsg = '사용 가능한 카메라 기기를 찾을 수 없습니다.';
                } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                    errorMsg = '카메라가 이미 다른 프로그램이나 탭에서 사용 중입니다. 다른 창을 닫고 다시 시도해 주세요.';
                }
                
                showModal(errorMsg);
            }
        }

        // 카메라 모달 닫기 및 스트림 해제
        function closeCameraModal() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-stream');
            
            modal.classList.add('hidden');
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => {
                    track.stop();
                });
                mediaStream = null;
            }
            
            if (video) {
                video.srcObject = null;
            }
        }

        // 스냅샷 촬영
        function takeSnapshot() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('camera-canvas');
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            base64ImageString = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('image-preview').src = base64ImageString;
            document.getElementById('preview-container').classList.remove('hidden');
            
            closeCameraModal();
        }

        // 파일 업로드 미리보기
        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageString = e.target.result;
                document.getElementById('image-preview').src = base64ImageString;
                document.getElementById('preview-container').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        function clearImage() {
            base64ImageString = "";
            document.getElementById('file-input').value = "";
            document.getElementById('image-preview').src = "";
            document.getElementById('preview-container').classList.add('hidden');
        }

        // 사용자 데이터 가져오기 (GAS 또는 로컬 테스트)
        async function fetchUserData() {
            if (!currentUser) return;
            
            if (GAS_WEB_APP_URL) {
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getUser&nickname=${encodeURIComponent(currentUser)}`);
                    const data = await response.json();
                    if (data.success) {
                        document.getElementById('streak-count').innerText = data.streak || 0;
                    }
                } catch (error) {
                    console.error("데이터 로드 실패:", error);
                }
            } else {
                // 백엔드 미연동 시 로컬 테스트용 가상 계산
                const records = JSON.parse(localStorage.getItem('mock_feed') || '[]');
                const userDates = {};
                records.forEach(r => {
                    if (r.nickname === currentUser) userDates[r.date] = true;
                });
                document.getElementById('streak-count').innerText = Object.keys(userDates).length;
            }
        }

        // 피드 데이터 가져오기 (GAS 또는 로컬 테스트)
        async function fetchFeedData() {
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm font-medium">피드를 불러오는 중...</div>';

            if (GAS_WEB_APP_URL) {
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getFeed`);
                    const data = await response.json();
                    renderFeed(data.success ? data.feed : []);
                } catch (error) {
                    feedList.innerHTML = '<div class="text-center py-12 text-red-400 text-sm font-medium">피드 로드 실패 (URL을 확인해주세요)</div>';
                }
            } else {
                // 백엔드 미연동 시 로컬 테스트용 피드 표시
                setTimeout(() => {
                    const records = JSON.parse(localStorage.getItem('mock_feed') || '[]');
                    renderFeed(records);
                }, 300);
            }
        }

        // 피드 HTML 렌더링
        function renderFeed(feedItems) {
            const feedList = document.getElementById('feed-list');
            if (feedItems && feedItems.length > 0) {
                feedList.innerHTML = feedItems.map(item => `
                    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3.5">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs">
                                    ${escapeHtml(item.nickname).charAt(0)}
                                </div>
                                <span class="font-bold text-slate-800 text-sm">${escapeHtml(item.nickname)}</span>
                            </div>
                            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.date)}</span>
                        </div>
                        <p class="text-sm text-slate-600 bg-slate-50 p-3.5 rounded-2xl border border-slate-100/80 leading-relaxed font-medium">
                            "${escapeHtml(item.resolution)}"
                        </p>
                        ${item.photo ? `<img src="${item.photo}" class="w-full h-52 object-cover rounded-2xl border border-slate-100 shadow-sm">` : ''}
                    </div>
                `).join('');
            } else {
                feedList.innerHTML = `
                    <div class="text-center py-16 space-y-2">
                        <div class="text-3xl">📭</div>
                        <p class="text-slate-400 text-sm font-medium">아직 등록된 아침 공부 인증이 없습니다.</p>
                        <p class="text-slate-300 text-xs">첫 번째로 오늘 인증을 완료해 보세요!</p>
                    </div>
                `;
            }
        }

        // 아침 공부 인증 전송 (GAS 또는 로컬 테스트)
        async function handleCertSubmit(event) {
            event.preventDefault();
            const resolution = document.getElementById('resolution-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const todayStr = new Date().toISOString().split('T')[0];

            if (!resolution) {
                showModal('오늘의 결심을 입력해주세요.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "저장 중... ⏳";

            if (GAS_WEB_APP_URL) {
                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'certify',
                            nickname: currentUser,
                            resolution: resolution,
                            photo: base64ImageString,
                            date: todayStr
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        showModal('아침 공부 인증이 완료되었습니다! 오늘도 멋진 하루 보내세요! 🎉');
                        document.getElementById('resolution-input').value = '';
                        clearImage();
                        fetchUserData();
                    } else {
                        showModal('저장 실패: ' + (data.message || '알 수 없는 오류'));
                    }
                } catch (error) {
                    showModal('서버 통신 중 오류가 발생했습니다.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "아침 공부 인증하기 ✨";
                }
            } else {
                // 백엔드 미연동 시 로컬스토리지에 저장하여 테스트 시뮬레이션
                setTimeout(() => {
                    const existingRecords = JSON.parse(localStorage.getItem('mock_feed') || '[]');
                    const newRecord = {
                        timestamp: new Date().toLocaleString(),
                        nickname: currentUser,
                        resolution: resolution,
                        date: todayStr,
                        photo: base64ImageString
                    };
                    existingRecords.unshift(newRecord);
                    localStorage.setItem('mock_feed', JSON.stringify(existingRecords));

                    showModal('프론트엔드 테스트 완료! 인증이 성공적으로 저장되었습니다. 🎉');
                    document.getElementById('resolution-input').value = '';
                    clearImage();
                    fetchUserData();
                    
                    submitBtn.disabled = false;
                    submitBtn.innerText = "아침 공부 인증하기 ✨";
                }, 500);
            }
        }

        // 유틸리티 함수
        function showModal(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
